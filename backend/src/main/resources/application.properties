spring.application.name=anime-ecommerce-backend

#PostgreSQL connection

spring.datasource.url=jdbc:postgresql://postgres:5432/animestore
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#Cloudinary

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_CLOUD_API_KEY}
cloudinary.api-secret=${CLOUDINARY_CLOUD_SECRETKEY}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

#Telegram bot
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.chat-id=${TELEGRAM_CHAT_ID}


# ==========================================
# BAKONG CONFIGURATION
# ==========================================

# Bakong SIT API
bakong.api.base-url=https://sit-api-bakong.nbc.gov.kh

# Credentials
bakong.api.token=${BAKONG_API_TOKEN}
bakong.khqr.account-id=${BAKONG_ACCOUNT_ID}

# Merchant information
bakong.khqr.merchant-name=${BAKONG_MERCHANT_NAME}
bakong.khqr.merchant-city=${BAKONG_MERCHANT_CITY}

# Supported currencies
bakong.khqr.usd-currency=${BAKONG_USD_CURRENCY:USD}
bakong.khqr.khr-currency=${BAKONG_KHR_CURRENCY:KHR}

# QR expiration policy
bakong.khqr.expiration-minutes=5
