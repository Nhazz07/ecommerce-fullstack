spring.application.name=anime-ecommerce-backend

#PostgreSQL connection

spring.datasource.url=jdbc:postgresql://postgres:5432/animestore
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#Cloudinary

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_CLOUD_API_KEY}
cloudinary.api-secret=${CLOUDINARY_CLOUD_SECRETKEY}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
